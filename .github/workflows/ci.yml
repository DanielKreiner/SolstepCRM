name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  statisch:
    name: Typen, Lint, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

  mandantentrennung:
    name: RLS-Isolationstest
    runs-on: ubuntu-latest
    # Läuft gegen das Staging-Projekt, niemals gegen Produktivdaten.
    # Ohne hinterlegte Secrets kann der Test nichts prüfen — dann soll er
    # auch nicht grün melden, sondern gar nicht erst laufen.
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Secrets prüfen
        env:
          URL: ${{ secrets.STAGING_SUPABASE_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::STAGING_SUPABASE_* ist nicht hinterlegt."
            echo "Der RLS-Isolationstest ist das einzige Gate gegen ein"
            echo "mandantenübergreifendes Datenleck. Er darf nicht fehlen."
            exit 1
          fi

      - name: Migrations und Seed ins Staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          pnpm exec supabase link --project-ref "${{ secrets.STAGING_PROJECT_REF }}"
          pnpm exec supabase db push --include-seed

      - name: Demo-Nutzer
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
        run: pnpm seed:users

      - name: Isolationstest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
        run: pnpm test
